# Replace the server_name and certificate locations for another host.
# Keep the Python service on loopback; the API deliberately checks Host.
server {
    listen 80;
    listen [::]:80;
    server_name prism.ddyu.online;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prism.ddyu.online;
    ssl_certificate /etc/letsencrypt/live/ddyu.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ddyu.online/privkey.pem;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
